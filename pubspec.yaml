name: call_record
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  
  # Permissions
  permission_handler: ^12.0.1
  
  # Call monitoring and handling
  phone_state: ^3.0.1
  flutter_phone_direct_caller: ^2.1.1
  call_log: ^6.0.1
  audioplayers: ^6.1.0
  
  # Storage and database
  path_provider: ^2.1.1
  sqflite: ^2.3.0
  
  # Audio recording
  record: ^6.1.2
  
  # Networking
  http: ^1.1.0
  
  # Utilities
  intl: ^0.20.2
  
  # State management
  provider: ^6.1.1
  url_launcher: ^6.3.2
  shared_preferences: ^2.5.4
  path: ^1.9.1
  flutter_contacts: ^2.0.0
  flutter_ringtone_player: ^4.0.0+4
  vibration: ^3.1.5
  flutter_displaymode: ^0.7.0
  share_plus: ^12.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
